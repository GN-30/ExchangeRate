<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Primary Meta -->
    <title>VoyageAI — AI-Powered Travel Planner</title>
    <meta name="description" content="Plan budgets, track expenses, and optimize your currency exchanges globally with AI-powered travel intelligence." />
    <meta name="keywords" content="travel planner, AI travel, budget tracker, currency exchange, trip planning" />
    <meta name="author" content="VoyageAI" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#00E5FF" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#FF3366" media="(prefers-color-scheme: light)" />

    <!-- PWA / Mobile Web App -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="VoyageAI" />
    <meta name="application-name" content="VoyageAI" />
    <meta name="msapplication-TileColor" content="#05050a" />
    <meta name="msapplication-tap-highlight" content="no" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="VoyageAI — AI-Powered Travel Planner" />
    <meta property="og:description" content="Plan budgets, track expenses, and optimize your currency exchanges globally." />
    <meta property="og:image" content="/hero-bg.jpg" />

    <!-- Favicons & Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/pwa-192.png" />

    <!-- Prevent FOUC on theme load -->
    <script>
      (function() {
        const stored = localStorage.getItem('theme');
        if (stored) document.documentElement.setAttribute('data-theme', stored);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
